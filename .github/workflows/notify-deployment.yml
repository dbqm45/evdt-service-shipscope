name: Notify ShipScope of deployment (reusable)

on:
  workflow_call:
    inputs:
      component:
        description: |-
          The component that just deployed. Must exactly match one of the components
          listed in evdt-service-shipscope's docs/components.json (e.g. evapl-service-frontend).
        type: string
        required: true
    secrets:
      SHIPSCOPE_APP_ID:
        required: true
      SHIPSCOPE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  notify:
    name: Trigger ShipScope sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.SHIPSCOPE_APP_ID }}
          private-key: ${{ secrets.SHIPSCOPE_APP_PRIVATE_KEY }}
          repositories: evdt-service-shipscope

      - name: Validate component name
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          # Single source of truth for tracked components lives in evdt-service-shipscope's
          # docs/components.json (on `live`, same ref every other sync/backfill job reads it from) —
          # fetched here instead of duplicating the list in this reusable workflow.
          KNOWN=$(curl -sf \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/circlek-global/evdt-service-shipscope/contents/docs/components.json?ref=live")

          echo "$KNOWN" | jq -e --arg c "$COMPONENT" 'any(.components[]; .name == $c)' > /dev/null || {
            echo "Error: unknown component \"$COMPONENT\" — must match one of the components listed in evdt-service-shipscope's docs/components.json." >&2
            exit 1
          }

      - name: Fire repository_dispatch (deployment-completed)
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/circlek-global/evdt-service-shipscope/dispatches \
            -d "{\"event_type\":\"deployment-completed\",\"client_payload\":{\"component\":\"$COMPONENT\"}}"

      - name: Fire repository_dispatch (flags-updated)
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/circlek-global/evdt-service-shipscope/dispatches \
            -d '{"event_type":"flags-updated"}'
