name: Orchestrate full sync
on:
  repository_dispatch:
    types: [deployment-completed]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # safety net, daily at 3 AM, in case a post-deploy signal is ever missed

permissions:
  contents: write

jobs:
  prepare:
    name: Determine which component(s) to sync
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      full: ${{ steps.set.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      - id: set
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
        run: |
          # repository_dispatch names exactly one component that just deployed — sync only that one,
          # as long as it's a known component (docs/components.json — the single source of truth for
          # tracked components). Any other trigger (cron safety net, manual run, unknown/malformed
          # dispatch) syncs all tracked components from that same file — `full` marks that case, so a
          # later job can record it as an actual full-sync timestamp, not just "something ran."
          if [ -n "$COMPONENT" ] && jq -e --arg c "$COMPONENT" 'any(.components[]; .name == $c)' docs/components.json > /dev/null; then
            echo "matrix={\"include\":[{\"repo\":\"$COMPONENT\",\"component\":\"$COMPONENT\"}]}" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(jq -c '{include: [.components[] | {repo: .name, component: .name}]}' docs/components.json)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

  sync_deployments:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CIRCLEK_GLOBAL_GITHUB_EVDT_APP_ID }}
          private-key: ${{ secrets.CIRCLEK_GLOBAL_GITHUB_EVDT_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.repo }}

      - name: Sync GitHub deployments
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_REPO: circlek-global/${{ matrix.repo }}
          COMPONENT: ${{ matrix.component }}
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/sync-github-deployments.js
          paths: docs/data/deployments.json
          message: "chore: sync deployments (${{ matrix.component }})"
          bot-name: orchestrator-bot

  sync_jira:
    needs: sync_deployments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      # TEMPORARY — diagnosing why /rest/api/3/project/search drops every referenced project key.
      # Remove this step once the root cause is confirmed and fixed.
      - name: DEBUG Jira connectivity
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          echo "--- /myself (who is authenticating) ---"
          curl -s -w "\nHTTP %{http_code}\n" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "$JIRA_BASE_URL/rest/api/3/myself"
          echo "--- /project/EBO (unambiguous single-key lookup, no array encoding) ---"
          curl -s -w "\nHTTP %{http_code}\n" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "$JIRA_BASE_URL/rest/api/3/project/EBO"
          echo "--- /project/search?keys=EBO (search, single key, zero ambiguity) ---"
          curl -s -w "\nHTTP %{http_code}\n" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "$JIRA_BASE_URL/rest/api/3/project/search?keys=EBO"

      - name: Sync Jira issues
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/sync-jira.js
          # Both paths so the one-time removal of the old, pre-sharding jira-issues.json (see
          # sync-jira.js) is captured in the same commit as the new per-PI files, not left orphaned.
          paths: docs/data/jira-issues docs/data/jira-issues.json
          message: "chore: sync jira (orchestrated)"
          bot-name: orchestrator-bot

  record_full_sync:
    name: Record last full sync timestamp
    needs: [prepare, sync_jira]
    if: needs.prepare.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      - name: Record full sync timestamp
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/record-full-sync.js
          paths: docs/data/sync-meta.json
          message: "chore: record last full sync timestamp"
          bot-name: orchestrator-bot