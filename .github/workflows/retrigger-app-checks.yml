name: Retrigger app repo checks
on:
  push:
    branches: [live]
    paths:
      - 'docs/data/flags-meta.json'

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CIRCLEK_GLOBAL_GITHUB_EVDT_APP_ID }}
          private-key: ${{ secrets.CIRCLEK_GLOBAL_GITHUB_EVDT_APP_PRIVATE_KEY }}
          repositories: evapl-service-frontend

      - name: Re-run failed flag metadata checks in the app repo
        env:
          APP_REPO: circlek-global/evapl-service-frontend
          APP_REPO_RERUN_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_FILE: check-flags-trigger.yml
        run: node scripts/retrigger-app-checks.js