name: Server tests

on:
  pull_request:
    paths:
      - 'server/**'
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix server
      - name: Bootstrap test Postgres role
        run: node server/scripts/setup-test-db.js
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm test --prefix server
        env:
          TEST_DATABASE_URL: postgres://shipscope_app:shipscope_app@localhost:5432/postgres
