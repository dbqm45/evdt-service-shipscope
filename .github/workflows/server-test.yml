name: Server tests

# The server/ suite against a real Postgres, on PRs that touch what it tests. Not on pushes to main: the Release
# workflow's verify job runs it on every merge.
on:
  pull_request:
    paths:
      - 'server/**'
      # Server tests also post the flags adapter's messages and the onboarding guide's examples through the route.
      - 'adapters/**'
      - 'ONBOARDING*.md'
      # The dashboard-data contract test (server/test/dashboard-contract.test.js) loads the frontend that reads it.
      - 'docs/app-*.js'

permissions:
  contents: read

# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix server
      - name: Bootstrap test Postgres role
        run: node server/scripts/setup-test-db.js
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm test --prefix server
        env:
          TEST_DATABASE_URL: postgres://shipscope_app:shipscope_app@localhost:5432/postgres
