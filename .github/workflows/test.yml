name: Tests

# On every PR, in one job (each job bills at least a minute):
# - the PR title: PRs are squash-merged, so the title becomes the commit on main and drives the next version
#   (RELEASING.md); checked again when only the title is edited, without re-running the tests;
# - the root test suite (`npm test`: scripts/, scripts/lib/, docs/app-*.js, the flags adapter, release tooling). No
#   path filters: the suite reads files from across the repo (test/release.test.js checks server/package.json too)
#   and runs in seconds. The root has no dependencies, so no `npm ci`.
# - actionlint over .github/workflows (expressions, job dependencies, and the run: scripts through the runner's
#   shellcheck), a release binary checked against a pinned SHA-256 rather than an action or a Docker image tag.
# Not on pushes to main: a merge is tested by the Release workflow's verify job (both suites, on the commit main ends
# up with), so running it here too would bill the same minutes twice.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR cancels the run still going for the older one. Title edits have their own group, so
# an edit never cancels the tests of a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

jobs:
  test:
    # An edit of the description alone leaves the title as it was: skipped (a skipped job bills no minutes).
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The title goes through an environment variable, never into the script text.
      - name: Conventional Commits PR title
        run: node scripts/check-commit-message.js "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - name: Root tests
        if: github.event.action != 'edited'
        run: npm test
      - name: actionlint
        if: github.event.action != 'edited'
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
