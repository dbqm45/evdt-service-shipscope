name: Check flag metadata (reusable)

on:
  workflow_call:
    inputs:
      FLAGS_SEARCH_ROOT:
        required: true
        type: string
    secrets:
      STATUS_REPO_TOKEN:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo (has the *.generated.ts files)
        uses: actions/checkout@v4

      - name: Checkout evdt-service-shipscope (scripts + data)
        uses: actions/checkout@v4
        with:
          repository: dbqm45/evdt-service-shipscope
          token: ${{ secrets.STATUS_REPO_TOKEN }}
          path: shipscope

      - name: Scaffold stub entries for any newly-discovered flags
        env:
          FLAGS_META_PATH: shipscope/docs/data/flags-meta.json
          FLAGS_SEARCH_ROOT: ${{ inputs.FLAGS_SEARCH_ROOT }}
        run: node shipscope/scripts/scaffold-flags-meta.js

      - name: Commit and push scaffolded stubs (if any)
        run: |
          cd shipscope
          git config user.name "flags-scaffold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/flags-meta.json
          git diff --staged --quiet || (git commit -m "chore: scaffold new flag metadata stub(s)" && git push)

      - name: Check flag metadata completeness
        env:
          FLAGS_META_PATH: shipscope/docs/data/flags-meta.json
          FLAGS_SEARCH_ROOT: ${{ inputs.FLAGS_SEARCH_ROOT }}
          STATUS_REPO_EDIT_URL: https://github.com/dbqm45/evdt-service-shipscope/edit/main/docs/data/flags-meta.json
        run: node shipscope/scripts/check-flags-metadata.js