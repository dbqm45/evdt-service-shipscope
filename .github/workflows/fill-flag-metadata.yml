name: Fill flag metadata
on:
  workflow_dispatch:
    inputs:
      flagKey:
        description: 'Flag key (must match the property name in the *-flags.ts interface)'
        required: true
      description:
        description: 'Short description of what this flag does'
        required: false
      source:
        description: 'How this flag is controlled'
        required: true
        type: choice
        options: [build, runtime-be]
      jiraKeys:
        description: 'Jira keys, comma-separated (e.g. SCRUM-5, SCRUM-11)'
        required: true
      components:
        description: 'Components, comma-separated (e.g. chargers-fe, chargers-be)'
        required: true

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      - name: Fill in flag metadata
        env:
          FLAG_KEY: ${{ github.event.inputs.flagKey }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          SOURCE: ${{ github.event.inputs.source }}
          JIRA_KEYS: ${{ github.event.inputs.jiraKeys }}
          COMPONENTS: ${{ github.event.inputs.components }}
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/fill-flag-metadata.js
          paths: docs/data/flags-meta.json
          message: "chore: fill metadata for ${{ github.event.inputs.flagKey }}"
          bot-name: flags-meta-bot