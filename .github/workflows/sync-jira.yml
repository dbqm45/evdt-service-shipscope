name: Sync Jira issues
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (contains the script)
        uses: actions/checkout@v4

      - name: Checkout status repo
        uses: actions/checkout@v4
        with:
          repository: dbqm45/evdt-service-shipscope
          token: ${{ secrets.STATUS_REPO_TOKEN }}
          path: status-repo

      - name: Run sync script
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          OUTPUT_PATH: status-repo/docs/data/jira-issues.json
        run: node scripts/sync-jira.js

      - name: Commit and push if changed
        run: |
          cd status-repo
          git config user.name "jira-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/jira-issues.json
          git diff --staged --quiet || (git commit -m "chore: sync jira issues" && git push)