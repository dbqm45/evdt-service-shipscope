name: Report deployment (reusable)

on:
  workflow_call:
    inputs:
      COMPONENT:
        required: true
        type: string
      ENVIRONMENT:
        required: true
        type: string
      CURRENT_VERSION:
        required: true
        type: string
      PREVIOUS_VERSION:
        required: false
        type: string
        default: ''
      DOMAIN:
        description: 'Flag-parts domain to resolve (e.g. "vendor"). Leave empty to skip flag resolution.'
        required: false
        type: string
        default: ''
      STATUS:
        description: '"success" or "failed"'
        required: false
        type: string
        default: 'success'
    secrets:
      STATUS_REPO_TOKEN:
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.CURRENT_VERSION }}
        continue-on-error: ${{ inputs.STATUS == 'failed' }}

      - name: Checkout evdt-service-shipscope (scripts + data)
        uses: actions/checkout@v4
        with:
          repository: dbqm45/evdt-service-shipscope
          token: ${{ secrets.STATUS_REPO_TOKEN }}
          path: shipscope

      - name: Extract release scope
        id: scope
        if: inputs.STATUS == 'success'
        env:
          CURRENT_VERSION: ${{ inputs.CURRENT_VERSION }}
          PREVIOUS_VERSION: ${{ inputs.PREVIOUS_VERSION }}
        run: |
          RESULT=$(node shipscope/scripts/extract-release-scope.js)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Resolve flags
        id: flags
        if: inputs.STATUS == 'success' && inputs.DOMAIN != ''
        run: |
          FLAGS=$(DOMAIN=${{ inputs.DOMAIN }} ENVIRONMENT=${{ inputs.ENVIRONMENT }} node shipscope/scripts/resolve-flags.js)
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Append deployment record
        run: |
          cd shipscope
          if [ "${{ inputs.STATUS }}" = "success" ]; then
            FLAGS_JSON='${{ steps.flags.outputs.flags }}'
            if [ -z "$FLAGS_JSON" ]; then FLAGS_JSON='{}'; fi
            NEW=$(echo '${{ steps.scope.outputs.result }}' | jq \
              --arg component "${{ inputs.COMPONENT }}" \
              --arg environment "${{ inputs.ENVIRONMENT }}" \
              --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg by "${{ github.actor }}" \
              --argjson flags "$FLAGS_JSON" \
              '{
                id: (.currentVersion + "-" + $component),
                component: $component, environment: $environment, version: .currentVersion,
                deployedAt: $t, deployedBy: $by, status: "success",
                relatedIssues: .relatedIssues, relatedPRs: .relatedPRs,
                resolvedFlags: $flags
              }')
          else
            NEW=$(jq -n \
              --arg id "${{ inputs.CURRENT_VERSION }}-${{ inputs.COMPONENT }}-failed-$(date +%s)" \
              --arg component "${{ inputs.COMPONENT }}" \
              --arg environment "${{ inputs.ENVIRONMENT }}" \
              --arg version "${{ inputs.CURRENT_VERSION }}" \
              --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg by "${{ github.actor }}" \
              '{id:$id, component:$component, environment:$environment, version:$version, deployedAt:$t, deployedBy:$by, status:"failed", relatedIssues:[]}')
          fi
          jq --argjson n "$NEW" '. += [$n]' docs/data/deployments.json > tmp.json && mv tmp.json docs/data/deployments.json

      - name: Commit and push
        run: |
          cd shipscope
          git config user.name "shipscope-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/deployments.json
          git commit -m "chore: report ${{ inputs.COMPONENT }} ${{ inputs.CURRENT_VERSION }} -> ${{ inputs.ENVIRONMENT }} (${{ inputs.STATUS }})"
          git push