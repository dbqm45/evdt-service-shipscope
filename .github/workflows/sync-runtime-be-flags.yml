name: Sync runtime-BE flags
on:
  repository_dispatch:
    types: [flags-updated, deployment-completed]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'  # safety net, daily at 3:15 AM, in case a flags-updated/deploy signal is ever missed

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      - name: Sync runtime-BE flag states
        env:
          URL_TEST: ${{ vars.RUNTIME_BE_FLAGS_URL_TEST }}
          URL_QA: ${{ vars.RUNTIME_BE_FLAGS_URL_QA }}
          URL_PROD: ${{ vars.RUNTIME_BE_FLAGS_URL_PROD }}
          COMPONENT: service-backend
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/sync-runtime-be-flags.js
          paths: docs/data/flag-states.json docs/data/flags-meta.json docs/data/flag-state-history.json
          message: "chore: sync runtime-BE flag states"
          bot-name: runtime-be-sync-bot