name: Update flag state
on:
  workflow_dispatch:
    inputs:
      flagKey:
        description: 'Flag key'
        required: true
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [test, qa, prod]
      enabled:
        description: 'New state'
        required: true
        type: choice
        options: ['true', 'false']
      changedBy:
        description: 'Who/what is making this change'
        required: false
        default: 'manual-test'
  repository_dispatch:
    types: [flag-changed]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live

      - name: Update flag-states.json
        env:
          FLAG_KEY: ${{ github.event.inputs.flagKey || github.event.client_payload.flagKey }}
          ENVIRONMENT: ${{ github.event.inputs.environment || github.event.client_payload.environment }}
          ENABLED: ${{ github.event.inputs.enabled || github.event.client_payload.enabled }}
          CHANGED_BY: ${{ github.event.inputs.changedBy || github.event.client_payload.changedBy }}
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/update-flag-state.js
          paths: docs/data/flag-states.json docs/data/flag-state-history.json
          message: "chore: update flag state"
          bot-name: flag-sync-bot