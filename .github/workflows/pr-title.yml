name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main and drives the next version
# (RELEASING.md). Runs on title edits too, without re-running the whole CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    # An edit of the description alone leaves the title as it was: skipped (a skipped job bills no minutes).
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The title goes through an environment variable, never into the script text.
      - run: node scripts/check-commit-message.js "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
