name: Backfill flag state history
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live
          fetch-depth: 0

      - name: Backfill flag state history from git log
        uses: ./.github/actions/sync-with-retry
        with:
          run: node scripts/backfill-flag-state-history.js
          paths: docs/data/flag-state-history.json
          message: "chore: backfill flag state history from git log"
          bot-name: orchestrator-bot
