name: ShipScope feature flags
description: Read feature flags from files or a URL and send their state for one environment to ShipScope.
inputs:
  shipscope-url:
    description: The ShipScope server, e.g. https://shipscope.example.com (not needed with dry-run).
    required: false
  token:
    description: The flag source's ingest token (shpi_...), from a secret (not needed with dry-run).
    required: false
  environment:
    description: The ShipScope environment these flags are for, test, qa or prod. Not with {env} in files.
    required: false
  files:
    description: File mode. Flags files or patterns, one per line (.json, .yaml, .properties, .env, .ts, .js), relative to the workspace; {env} in a pattern stands for the environment's name, e.g. domains/*/config/flags/{env}.ts.
    required: false
  env-map:
    description: With {env} in files, which names are which ShipScope environment, e.g. dev=test, qa=qa, prod=prod (default test, qa and prod as themselves; other names are skipped).
    required: false
  url:
    description: URL mode. Where to fetch the flags (JSON unless format is given).
    required: false
  url-headers:
    description: Request headers for url, one "Name: value" per line.
    required: false
  format:
    description: json, yaml, properties, env or ts (default by file name; json for url).
    required: false
  path:
    description: Dot path to the object of flags inside the document, e.g. features (in a .ts file starting with its const name, when it has several).
    required: false
  value-path:
    description: Dot path to the value inside each flag's object, e.g. enabled (in a list of flag objects default enabled, value, state, on, status or active).
    required: false
  key-field:
    description: In a list of flag objects, the field with each flag's key (default key, name, id or flag).
    required: false
  rollout-path:
    description: Dot path to a percentage beside each flag's value, e.g. rollout; an enabled flag below 100 becomes a partial rollout.
    required: false
  prefix:
    description: Only keys starting with this, without it in the flag key, e.g. feature.
    required: false
  changed-by:
    description: Shown as who changed the flags (default the source's name).
    required: false
  complete:
    description: true sends the full state (flags not listed are removed); false only these flags.
    required: false
    default: 'true'
  dry-run:
    description: true prints the message and sends nothing.
    required: false
    default: 'false'
outputs:
  flags:
    description: Number of flags in the message.
  changed:
    description: Values ShipScope changed (0 on a dry run).
  removed:
    description: Values ShipScope marked removed (0 on a dry run).
runs:
  using: node24
  main: action.js
