services:
  - type: web
    name: shipscope-web
    runtime: node
    rootDir: server
    region: oregon
    plan: starter # confirm the current paid-tier slug in the Render dashboard/CLI before applying — never free (see infrastructure.md's risk register on 30-day Postgres expiry / cold starts)
    buildCommand: npm ci
    startCommand: node web.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipscope-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # GitHub sign-in (FR-001). sync: false = Render prompts for the value; it never comes from this file.
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL # the service's public https URL, e.g. https://shipscope-web.onrender.com
        sync: false
      # Connecting repos (FR-004): the App's ID, URL name and private key (PEM). All three, or none.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Optional: the App's webhook secret (GitHub App settings -> Webhook), for deployments within a minute.
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      # Connecting Jira (FR-007): the Atlassian OAuth 2.0 (3LO) app and the key that encrypts stored Jira
      # tokens (openssl rand -base64 32). All three, or none. Changing the key makes every tenant reconnect Jira.
      - key: ATLASSIAN_CLIENT_ID
        sync: false
      - key: ATLASSIAN_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: shipscope-worker
    runtime: node
    rootDir: server
    region: oregon
    plan: starter # same note as above — confirm current slug, never free
    buildCommand: npm ci
    startCommand: node worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipscope-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Deployment sync (FR-005) runs as the GitHub App: same three values as the Web Service.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Jira issue sync (FR-009) uses the tenants' stored Jira tokens: same three values as the Web Service.
      - key: ATLASSIAN_CLIENT_ID
        sync: false
      - key: ATLASSIAN_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # The Web Service's public https URL (same value): the worker registers Jira webhooks at <url>/webhooks/jira.
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: shipscope-db
    region: oregon
    plan: starter # paid tier only — free Postgres on Render expires after 30 days
