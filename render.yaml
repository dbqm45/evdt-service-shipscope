services:
  - type: web
    name: shipscope-web
    runtime: node
    rootDir: server
    region: oregon
    plan: starter # confirm the current paid-tier slug in the Render dashboard/CLI before applying — never free (see infrastructure.md's risk register on 30-day Postgres expiry / cold starts)
    buildCommand: npm ci
    startCommand: node web.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipscope-db
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: worker
    name: shipscope-worker
    runtime: node
    rootDir: server
    region: oregon
    plan: starter # same note as above — confirm current slug, never free
    buildCommand: npm ci
    startCommand: node worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipscope-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: shipscope-db
    region: oregon
    plan: starter # paid tier only — free Postgres on Render expires after 30 days
