# Render Blueprint for the SaaS backend (server/). Both services build and run from the repo root, not
# `rootDir: server`: Render makes files outside a service's root directory unavailable at build and run time, and
# the Web Service serves the dashboard and settings pages from docs/ (`../docs` seen from server/). buildFilter keeps
# deploys to what the services actually use, so the bots' data commits and the file-based scripts don't redeploy.
# Migrations run before every deploy of either service (lib/migrate.js holds an advisory lock, so the two never
# apply a file twice); a migration that fails stops the deploy and the previous version keeps running.
services:
  - type: web
    name: shipscope-web
    runtime: node
    region: oregon
    plan: starter # confirm the current paid-tier slug in the Render dashboard/CLI before applying — never free (see infrastructure.md's risk register on 30-day Postgres expiry / cold starts)
    buildCommand: npm ci --prefix server
    preDeployCommand: node server/scripts/migrate.js
    startCommand: node server/web.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
        - docs/*.html
        - docs/*.css
        - docs/*.js
        - docs/*.svg
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: shipscope-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # GitHub sign-in (FR-001). sync: false = Render prompts for the value; it never comes from this file.
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL # the service's public https URL, e.g. https://shipscope-web.onrender.com
        sync: false
      # Connecting repos (FR-004): the App's ID, URL name and private key (PEM). All three, or none.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Optional: the App's webhook secret (GitHub App settings -> Webhook), for deployments within a minute.
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      # Connecting Jira (FR-007): the Atlassian OAuth 2.0 (3LO) app and the key that encrypts stored Jira
      # tokens (openssl rand -base64 32). All three, or none. Changing the key makes every tenant reconnect Jira.
      - key: ATLASSIAN_CLIENT_ID
        sync: false
      - key: ATLASSIAN_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: shipscope-worker
    runtime: node
    region: oregon
    plan: starter # same note as above — confirm current slug, never free
    buildCommand: npm ci --prefix server
    preDeployCommand: node server/scripts/migrate.js
    startCommand: node server/worker.js
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: shipscope-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Deployment sync (FR-005) runs as the GitHub App: same three values as the Web Service.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Jira issue sync (FR-009) uses the tenants' stored Jira tokens: same three values as the Web Service.
      - key: ATLASSIAN_CLIENT_ID
        sync: false
      - key: ATLASSIAN_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # The Web Service's public https URL (same value): the worker registers Jira webhooks at <url>/webhooks/jira.
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: shipscope-db
    region: oregon
    plan: starter # paid tier only — free Postgres on Render expires after 30 days
